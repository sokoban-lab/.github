<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradient covering the whole canvas -->
    <linearGradient id="gold" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- Cutout mask -->
    <mask id="flaskCutout">
      <rect width="256" height="256" fill="white" />
      <!-- Black areas are cut out -->
      <g fill="black">
        <!-- Flask neck opening -->
        <rect x="92" y="56" width="72" height="18" rx="9"/>
        <!-- Flask neck -->
        <rect x="108" y="74" width="40" height="36"/>
        <!-- Flask body (narrower bottom) -->
        <path d="M108 110 L64 192 A 16 16 0 0 0 80 208 L176 208 A 16 16 0 0 0 192 192 L148 110 Z"/>
      </g>
    </mask>
  </defs>

  <!-- Main box (sharp corners, filling the viewport) -->
  <rect x="0" y="0" width="256" height="256" fill="url(#gold)" mask="url(#flaskCutout)"/>

  <!-- Target dot inside the flask -->
  <circle cx="128" cy="150" r="22" fill="url(#gold)"/>
</svg>